[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-athlete"
version = "0.1.0"
description = "Hybrid strength/endurance training automation library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
hybrid-athlete = "hybrid_athlete.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
lint = [
    "ruff>=0.4",
]
typecheck = [
    "mypy>=1.10",
]
dev = [
    "hybrid-athlete[test,lint,typecheck]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_athlete"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hybrid_athlete"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["hybrid_athlete"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=hybrid_athlete",
    "--cov-report=term-missing",
    "-v",
]

[tool.coverage.run]
source = ["src/hybrid_athlete"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
